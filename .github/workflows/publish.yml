name: Publish @sofereditor/* to npm

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # cria tags por pacote após publicar
      id-token: write   # OIDC pro npm Trusted Publisher + provenance
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      # Setup-node com registry-url cria um .npmrc em $RUNNER_TEMP com
      # `_authToken=${NODE_AUTH_TOKEN}`. Trusted Publisher OIDC funciona
      # quando NODE_AUTH_TOKEN não está setado E o id-token está disponível
      # (npm 11.5+ detecta GitHub Actions e usa OIDC automaticamente).
      # Não passamos NODE_AUTH_TOKEN no env do step de publish — npm CLI
      # vê o placeholder ${NODE_AUTH_TOKEN} sem substituição e cai no OIDC.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Garante npm >= 11.5.1 (Trusted Publisher OIDC)
        run: |
          npm install -g npm@latest --force
          npm --version

      # setup-node escreve `_authToken=${NODE_AUTH_TOKEN}` no .npmrc;
      # sem NPM_TOKEN secret, isso vai como token vazio e quebra OIDC
      # (404 antes do registry validar Trusted Publisher). Removemos a
      # linha pra npm 11.5+ disparar OIDC automaticamente.
      - name: Remove _authToken do .npmrc para forçar OIDC
        run: |
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          echo "Editing: $npmrc"
          if [ -f "$npmrc" ]; then
            cat "$npmrc"
            echo "---"
            sed -i '/_authToken/d' "$npmrc"
            cat "$npmrc"
          else
            echo "(no .npmrc found)"
            echo "registry=https://registry.npmjs.org/" > "$npmrc"
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build precisa rodar antes do typecheck porque packages que apontam
      # types pra dist/ (ex.: @sofereditor/export-pdf) só ficam type-resolvable
      # após o tsup gerar os .d.ts.
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Sequencial e em ordem topológica: core publica antes dos demais, porque
      # pnpm publish reescreve `workspace:*` pra `^<version>` real (a do core
      # precisa existir no npm quando o consumidor for instalar @sofer/react).
      - name: Publica pacotes (skip private / já publicados)
        id: publish
        env:
          NPM_CONFIG_PROVENANCE: 'true'
          # Explicitly unset NODE_AUTH_TOKEN — quando existe (mesmo vazio),
          # npm CLI assume "use classic auth" e nunca dispara o fluxo
          # Trusted Publisher OIDC.
          NODE_AUTH_TOKEN: ''
        run: |
          set -euo pipefail
          unset NODE_AUTH_TOKEN || true
          : > /tmp/sofer-published-tags
          PKGS="core react collab import-docx export-docx export-pdf"
          for pkg in $PKGS; do
            cd "packages/$pkg"
            NAME=$(node -p "require('./package.json').name")
            VERSION=$(node -p "require('./package.json').version")
            PRIVATE=$(node -p "require('./package.json').private || false")
            if [ "$PRIVATE" = "true" ]; then
              echo "::notice title=Skip private::$NAME marcado private — não publica"
              cd - >/dev/null
              continue
            fi
            if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
              echo "::notice title=Já publicado::$NAME@$VERSION — skip"
            else
              echo "::notice title=Publicando::$NAME@$VERSION"
              # Reescreve workspace:* pra ^<version> real (resolvido a partir
              # do package.json do pacote workspace dependente). Sem isso, npm
              # publish reclama que workspace: não é semver válido.
              #
              # TAMBÉM aplica os overrides de MANIFESTO do publishConfig
              # (main/module/types/exports) pro topo. CRÍTICO: `npm publish` NÃO
              # aplica publishConfig de manifesto (isso é recurso do pnpm/yarn);
              # sem isto o pacote publicado mantém main/exports apontando pro
              # ./src/index.ts (que NÃO vai no tarball, só `dist`) e a resolução
              # quebra em TODOS os consumidores ("Cannot find module").
              node -e '
                const fs = require("fs");
                const path = require("path");
                const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
                for (const section of ["dependencies", "peerDependencies", "devDependencies"]) {
                  const deps = pkg[section];
                  if (!deps) continue;
                  for (const [k, v] of Object.entries(deps)) {
                    if (typeof v === "string" && v.startsWith("workspace:")) {
                      const realPkg = JSON.parse(fs.readFileSync(`../${k.split("/")[1]}/package.json`, "utf8"));
                      deps[k] = `^${realPkg.version}`;
                    }
                  }
                }
                if (pkg.publishConfig) {
                  for (const key of ["main", "module", "types", "exports", "bin"]) {
                    if (pkg.publishConfig[key] !== undefined) pkg[key] = pkg.publishConfig[key];
                  }
                }
                fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
              '
              # `npm publish` da doc oficial do Trusted Publisher: rodando
              # do diretório do pacote, sem tarball arg.
              npm publish --access public --provenance
              echo "${NAME}@${VERSION}" >> /tmp/sofer-published-tags
            fi
            cd - >/dev/null
          done
          if [ -s /tmp/sofer-published-tags ]; then
            echo "tagged=true" >> "$GITHUB_OUTPUT"
          else
            echo "tagged=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cria tags git pros pacotes publicados
        if: steps.publish.outputs.tagged == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const raw = fs.readFileSync('/tmp/sofer-published-tags', 'utf8');
            const tags = raw.split('\n').map(s => s.trim()).filter(Boolean);
            for (const tag of tags) {
              try {
                await github.rest.git.createRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `refs/tags/${tag}`,
                  sha: context.sha,
                });
                core.notice(`Tag ${tag} criada`);
              } catch (e) {
                if (e.status === 422) {
                  core.notice(`Tag ${tag} já existe — skip`);
                } else {
                  throw e;
                }
              }
            }
